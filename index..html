<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focacciami — Dashboard</title>
<style>
  html,body { margin:0; height:100%; }
  body { background:#E7E0D2; display:flex; align-items:center; justify-content:center;
         font:14px/1.5 -apple-system,BlinkMacSystemFont,sans-serif; color:#8A8177; }
  .box { text-align:center; }
  .mark { font-size:22px; letter-spacing:.18em; color:#C6421F; font-weight:700; margin-bottom:14px; }
  .bar { width:180px; height:3px; background:#D6CDBE; border-radius:2px; overflow:hidden; margin:0 auto 12px; }
  .bar i { display:block; height:100%; width:40%; background:#C6421F; animation:slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0%{transform:translateX(-100%)} 100%{transform:translateX(350%)} }
  a { color:#C6421F; }
</style>
</head>
<body>
<div class="box" id="boot">
  <div class="mark">FOCACCIAMI</div>
  <div class="bar"><i></i></div>
  <div id="msg">Caricamento…</div>
</div>
<script>
(function(){
  var URL_ = 'https://szpjulwrtvfmmiohfqav.supabase.co';
  var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN6cGp1bHdydHZmbW1pb2hmcWF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyOTMwMTUsImV4cCI6MjA5OTg2OTAxNX0.fpJUxaB3fdC7_SyjWfFEuM5PX5SlQ4fL9AYaIUzm8qY';
  var msg = document.getElementById('msg');
  function fail(t){ msg.innerHTML = t; }

  fetch(URL_ + '/rest/v1/focacciami_data?id=eq.app_build&select=value', {
    headers: { apikey: KEY, Authorization: 'Bearer ' + KEY }, cache: 'no-store'
  })
  .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(function(rows){
    var v = rows && rows[0] && rows[0].value;
    var html = v && v.html;
    if (!html) throw new Error('nessuna versione pubblicata');
    try { localStorage.setItem('focacciami_build_cache', html); } catch(e){}
    document.open(); document.write(html); document.close();
  })
  .catch(function(e){
    var cached = null;
    try { cached = localStorage.getItem('focacciami_build_cache'); } catch(e2){}
    if (cached) { document.open(); document.write(cached); document.close(); return; }
    fail('Impossibile caricare la dashboard.<br><small>' + (e.message || e) + '</small>');
  });
})();
</script>
</body>
</html>
