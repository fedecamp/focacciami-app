<body>
  <div id="__bundler_thumbnail">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#E7E0D2"></rect>
    <rect x="150" y="140" width="900" height="520" rx="40" fill="#F7EFE2"></rect>
    <text x="600" y="410" text-anchor="middle" font-family="Georgia, serif" font-size="120" font-weight="700" fill="#C4552D">FOCACCIAMI</text>
    <text x="600" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" fill="#9A8A70">Dashboard vendite</text>
  </svg>
</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

eek: null, trash: [], showTrash: false, showReport: false, reportSel: {}, dataPriceOverride: {}, costStructDefault: null, syncStatus: 'boot' };\n\n  _loadFromLocal() {\n    try {\n      const s = JSON.parse(localStorage.getItem('focacciami_mult_v1') || '{}');\n      if (s && typeof s === 'object') {\n        const clamped = {};\n        for (const k in s) clamped[k] = Math.min(6.5, Math.max(0.5, s[k]));\n        this.setState({ multByName: clamped });\n      }\n      const p = JSON.parse(localStorage.getItem('focacciami_price_v1') || '{}');\n      if (p && typeof p === 'object') this.setState({ priceByName: p });\n      const u = JSON.parse(localStorage.getItem('focacciami_units_v1') || '{}');\n      if (u && typeof u === 'object') this.setState({ unitsByName: u });\n      const f = parseFloat(localStorage.getItem('focacciami_fixed_v1'));\n      if (!isNaN(f) && f >= 0) this.setState({ fixedCost: f });\n      const v = parseFloat(localStorage.getItem('focacciami_volume_v1'));\n      if (!isNaN(v) && v >= 0) this.setState({ targetVolume: v });\n      const cs = JSON.parse(localStorage.getItem('focacciami_coststruct_v1') || 'null');\n      if (cs && typeof cs === 'object') this.setState((st) => ({ costStruct: { ...st.costStruct, ...cs } }));\n      const wk = JSON.parse(localStorage.getItem('focacciami_weeks_v1') || '[]');\n      if (Array.isArray(wk)) this.setState({ weeks: wk });\n      const tr = JSON.parse(localStorage.getItem('focacciami_weeks_trash_v1') || '[]');\n      if (Array.isArray(tr)) this.setState({ trash: tr });\n      const dpo = JSON.parse(localStorage.getItem('focacciami_dpo_v1') || 'null');\n      if (dpo && typeof dpo === 'object') this.setState({ dataPriceOverride: dpo });\n      const dao = JSON.parse(localStorage.getItem('focacciami_archived_v1') || 'null');\n      if (dao && typeof dao === 'object') this.setState({ dataArchivedOverride: dao });\n      const dso = JSON.parse(localStorage.getItem('focacciami_special_v1') || 'null');\n      if (dso && typeof dso === 'object') this.setState({ dataSpecialOverride: dso });\n      const bh = JSON.parse(localStorage.getItem('focacciami_backups_v1') || '[]');\n      if (Array.isArray(bh)) this.setState({ backupHistory: bh });\n      const fco = JSON.parse(localStorage.getItem('focacciami_fc_override_v1') || '{}');\n      if (fco && typeof fco === 'object') this.setState({ fcOverride: fco });\n      const csDefault = JSON.parse(localStorage.getItem('focacciami_coststruct_default_v1') || 'null');\n      if (csDefault && typeof csDefault === 'object') this.setState({ costStructDefault: csDefault });\n    } catch (e) {}\n  }\n  componentDidMount() {\n    this._t = setTimeout(() => this.setState({ revealed: true }), 200);\n    const applyStatus = () => {\n      const st = (window.__fcSync && window.__fcSync.status) || 'boot';\n      if (this.state.syncStatus !== st) this.setState({ syncStatus: st });\n    };\n    applyStatus();\n    const run = () => { this._loadFromLocal(); applyStatus(); };\n    if (window.__fcSync && window.__fcSync.ready) run();\n    else window.addEventListener('fc-sync-ready', run, { once: true });\n    this._onRefresh = () => this._loadFromLocal();\n    window.addEventListener('fc-sync-refreshed', this._onRefresh);\n    this._onStatus = applyStatus;\n    window.addEventListener('fc-sync-status', this._onStatus);\n    window.addEventListener('fc-sync-ready', this._onStatus);\n    this._pollStatus = setInterval(applyStatus, 800);\n    setTimeout(() => { if (!window.__fcSync || !window.__fcSync.ready) run(); }, 4000);\n  }\n  componentWillUnmount() {\n    clearTimeout(this._t); clearTimeout(this._st); clearTimeout(this._sp); clearTimeout(this._su); clearTimeout(this._sf); clearTimeout(this._sc);\n    if (this._pollStatus) clearInterval(this._pollStatus);\n    if (this._onRefresh) window.removeEventListener('fc-sync-refreshed', this._onRefresh);\n    if (this._onStatus) { window.removeEventListener('fc-sync-status', this._onStatus); window.removeEventListener('fc-sync-ready', this._onStatus); }\n  }\n\n  renderVals() {\n    const DATA_BASE = [\n      { name: 'ALLEGRAMENTE', fc: 2.45, price: 12, note: '' },\n      { name: 'PROFONDAMENTE', fc: 1.75, price: 9, note: '' },\n      { name: 'IN THE CLUB', fc: 2.76, price: 12, note: 'manca incidenza della maionese al bacon' },\n      { name: 'CAPRESE', fc: 1.67, price: 8, note: '' },\n      { name: 'NEW YORK NEW YORK', fc: 2.92, price: 12, note: 'manca incidenza dei cetriolini' },\n      { name: 'CON ELEGANZA', fc: 2.36, price: 10, note: '' },\n      { name: 'PARMIGIANA', fc: 2.38, price: 10, note: 'da valutare prezzo vendita' },\n      { name: 'CON CORAGGIO', fc: 2.42, price: 10, note: '', archived: true, archivedNote: 'Momentaneamente fuori menù — possibile reintroduzione a dicembre' },\n      { name: 'CARPACCIO DI MANZO', fc: 3.16, price: 12, note: '' },\n      { name: 'INTENSAMENTE', fc: 3.85, price: 14, note: '' },\n      { name: 'FLORIDAMENTE', fc: 6.36, price: 14, note: '', deleted: true, deletedNote: 'Eliminata dal menù (food cost troppo alto rispetto al prezzo di vendita)' },\n      { name: 'SPORTIVAMENTE', fc: 2.77, price: 10, note: 'manzo fum\\u00e8 (fesa) al posto della bresaola' },\n      { name: 'FORTE FORTE', fc: 3.14, price: 12, note: 'melanzane grigliate al posto della caponata' },\n      { name: 'ROMANTICAMENTE', fc: 2.24, price: 8, note: '' },\n      { name: 'CON AMORE', fc: 2.71, price: 10, note: 'solo crema di pistacchio e meno stracciatella: 100 g' },\n      { name: 'CON PASSIONE', fc: 3.51, price: 12, note: 'meno stracciatella: 100 g' },\n      { name: 'PIANO PIANO', fc: 3.19, price: 10, note: '' },\n      { name: 'DOLCEMENTE', fc: 0.91, price: 3.5, note: '', type: 'dolce' },\n      { name: 'PIZZA ROSSA', fc: 0.68, price: 2.5, note: '', type: 'trancio' },\n      { name: 'TRICOLORE', fc: 0.87, price: 3.5, note: '', type: 'trancio' },\n      { name: 'PIZZA MARGHERITA', fc: 1.10, price: 3, note: '', type: 'trancio' },\n      { name: 'POMODORINI', fc: 1.53, price: 3.5, note: '', type: 'trancio' }\n    ];\n    const dpoMap = this.state.dataPriceOverride || {};\n    const daoMap = this.state.dataArchivedOverride || {};\n    const dsoMap = this.state.dataSpecialOverride || {};\n    const fcoMap = this.state.fcOverride || {};\n    const fceMap = this.state.fcEdit || {};\n    const DATA = DATA_BASE.map((d) => {\n      let out = d;\n      if (dpoMap[d.name] != null) out = Object.assign({}, out, { price: dpoMap[d.name] });\n      if (daoMap[d.name] != null) out = Object.assign({}, out, { archived: !!daoMap[d.name] });\n      if (dsoMap[d.name] != null) out = Object.assign({}, out, { special: !!dsoMap[d.name] });\n      if (fcoMap[d.name] != null) out = Object.assign({}, out, { fc: Number(fcoMap[d.name]) });\n      if (fceMap[d.name] != null) {\n        const _p = parseFloat(String(fceMap[d.name]).replace(',', '.'));\n        if (!isNaN(_p) && _p >= 0) out = Object.assign({}, out, { fc: Math.round(_p * 100) / 100 });\n      }\n      return out;\n    });\n    const globalMult = this.props.mult ?? 3.5;\n    const ordina = this.props.ordina ?? 'scostamento';\n    const weeks = this.state.weeks || [];\n    const viewing = this.state.viewWeek != null ? weeks.find((w) => w.id === this.state.viewWeek) : null;\n    const editing = this.state.editWeek != null;\n    const RO = !!viewing && !editing;\n    const src = (viewing && !editing)\n      ? { multByName: viewing.multByName || {}, priceByName: viewing.priceByName || {}, unitsByName: viewing.unitsByName || {}, costStruct: viewing.costStruct }\n      : { multByName: this.state.multByName, priceByName: this.state.priceByName, unitsByName: this.state.unitsByName, costStruct: this.state.costStruct };\n    const prevSnap = viewing ? weeks[weeks.findIndex((w) => w.id === viewing.id) - 1] : (weeks.length ? weeks[weeks.length - 1] : null);\n    const multOf = (name) => src.multByName[name] ?? globalMult;\n    const origPriceOf = (name) => DATA.find((x) => x.name === name).price;\n    const priceOf = (name) => src.priceByName[name] ?? origPriceOf(name);\n    const fmt = (n) => n.toFixed(2).replace('.', ',');\n    const eur = (n) => fmt(n) + ' \\u20ac';\n    const sgn = (n) => (n >= 0 ? '+' : '\\u2212') + fmt(Math.abs(n)) + ' \\u20ac';\n\n    const CATS = [\n      { label: '', colA: '#2E7D46' },\n      { label: 'In linea', colA: '#7E9C3F' },\n      { label: 'Fino a 1,5 \\u20ac sotto', colA: '#D98324' },\n      { label: 'Oltre 1,5 \\u20ac sotto', colA: '#B3372B' }\n    ];\n\n    let base = DATA.map((d) => {\n      const mult = multOf(d.name);\n      const price = priceOf(d.name);\n      const sugg = d.fc * mult;\n      const delta = price - sugg;\n      const cat = delta > 0 ? 0 : delta >= -1.5 ? 2 : 3;\n      return { ...d, type: d.type || 'focaccia', mult, price, sugg, delta, margin: sugg - d.fc, menuMargin: price - d.fc, fcPct: (d.fc / sugg) * 100, cat };\n    });\n    const sorters = {\n      scostamento: (a, b) => b.delta - a.delta,\n      margine: (a, b) => b.margin - a.margin,\n      prezzo: (a, b) => b.price - a.price,\n      'food cost %': (a, b) => b.fcPct - a.fcPct\n    };\n    base.sort(sorters[ordina] || sorters.scostamento);\n\n    const rev = this.state.revealed;\n    const focList = base.filter((d) => !d.deleted && !d.archived && !d.special && d.type !== 'trancio' && d.type !== 'dolce');\n    const specialList = base.filter((d) => !d.deleted && !d.archived && d.special && d.type !== 'trancio' && d.type !== 'dolce');\n    const tranList = base.filter((d) => !d.deleted && !d.archived && d.type === 'trancio');\n    const dolceList = base.filter((d) => !d.deleted && !d.archived && d.type === 'dolce');\n    const archivedList = base.filter((d) => !d.deleted && d.archived);\n    const deletedList = base.filter((d) => d.deleted);\n    const buildItems = (list) => {\n      const mx = Math.max(...list.map((d) => Math.max(d.price, d.sugg)), 1) * 1.04;\n      return list.map((d, i) => ({\n        name: d.name,\n        priceF: fmt(d.price),\n        deltaF: sgn(d.delta),\n        colA: CATS[d.cat].colA,\n        barW: rev ? ((d.price / mx) * 100).toFixed(1) + '%' : '0%',\n        suggPos: ((d.sugg / mx) * 100).toFixed(1) + '%',\n        trDelay: (i * 0.035).toFixed(2) + 's',\n        rowBgA: this.state.selA === d.name ? '#F3E4C6' : 'transparent',\n        onSelA: () => this.setState({ selA: d.name, fcEdit: {} })\n      }));\n    };\n    const items = buildItems(focList);\n    const itemsSpecial = buildItems(specialList);\n    const itemsTranci = buildItems(tranList);\n    const itemsDolci = buildItems(dolceList);\n    const itemsArchived = buildItems(archivedList);\n    const itemsDeleted = buildItems(deletedList);\n    const searchLower = (this.state.searchQuery || '').trim().toLowerCase();\n    const hasSearch = searchLower.length > 0;\n    const matchQ = (it) => !hasSearch || it.name.toLowerCase().includes(searchLower);\n    const itemsF = hasSearch ? items.filter(matchQ) : items;\n    const itemsSpecialF = hasSearch ? itemsSpecial.filter(matchQ) : itemsSpecial;\n    const itemsTranciF = hasSearch ? itemsTranci.filter(matchQ) : itemsTranci;\n    const itemsDolciF = hasSearch ? itemsDolci.filter(matchQ) : itemsDolci;\n    const itemsArchivedF = hasSearch ? itemsArchived.filter(matchQ) : itemsArchived;\n    const itemsDeletedF = hasSearch ? itemsDeleted.filter(matchQ) : itemsDeleted;\n    const searchMatchCount = itemsF.length + itemsSpecialF.length + itemsTranciF.length + itemsDolciF.length + itemsArchivedF.length + itemsDeletedF.length;\n    const hasSpecial = hasSearch ? itemsSpecialF.length > 0 : specialList.length > 0;\n    const hasTranci = hasSearch ? itemsTranciF.length > 0 : tranList.length > 0;\n    const hasDolci = hasSearch ? itemsDolciF.length > 0 : dolceList.length > 0;\n    const hasArchived = hasSearch ? itemsArchivedF.length > 0 : archivedList.length > 0;\n    const hasDeleted = hasSearch ? itemsDeletedF.length > 0 : deletedList.length > 0;\n\n    const nSotto = base.filter((d) => d.delta <= 0).length;\n    const totMargin = base.reduce((s, d) => s + d.margin, 0);\n    const wFcBase = base.filter((d) => !d.archived && !d.deleted);\n    const wFc = (wFcBase.reduce((s, d) => s + d.fc, 0) / Math.max(wFcBase.reduce((s, d) => s + d.price, 0), 0.0001)) * 100;\n    const unitsOf = (name) => src.unitsByName[name];\n    const unitsCount = base.filter((x) => unitsOf(x.name) > 0).length;\n    const weekRevenue = base.reduce((s, x) => s + (unitsOf(x.name) > 0 ? unitsOf(x.name) * x.price : 0), 0);\n    const weekMargin = base.reduce((s, x) => s + (unitsOf(x.name) > 0 ? unitsOf(x.name) * (x.price - x.fc) : 0), 0);\n    const hasSales = unitsCount > 0;\n    const avgMenuMargin = base.reduce((s, x) => s + x.menuMargin, 0) / base.length;\n    const fixedCost = this.state.fixedCost;\n    const beUnits = fixedCost > 0 ? fixedCost / avgMenuMargin : null;\n    const beCoverage = (hasSales && beUnits) ? (weekMargin / fixedCost) * 100 : null;\n    const targetVolume = this.state.targetVolume;\n    const fixedPerPiece = (fixedCost > 0 && targetVolume > 0) ? fixedCost / targetVolume : null;\n    const netMarginPiece = fixedPerPiece != null ? avgMenuMargin - fixedPerPiece : null;\n    const netWeek = (targetVolume > 0 && fixedCost >= 0) ? targetVolume * avgMenuMargin - fixedCost : null;\n\n    const CS_DEF = [\n      { key: 'personale', label: 'Personale', range: '22\\u201326%' },\n      { key: 'locazione', label: 'Locazione / canone suolo pubblico', range: '6\\u20139%' },\n      { key: 'packaging', label: 'Packaging (contenitori, carta, sacchetti)', range: '3\\u20135%' },\n      { key: 'utenze', label: 'Utenze (gas, luce, acqua)', range: '3\\u20134%' },\n      { key: 'marketing', label: 'Marketing e promozione', range: '2\\u20133%' },\n      { key: 'manutenzione', label: 'Manutenzione attrezzature', range: '~2%' },\n      { key: 'assicurazioni', label: 'Assicurazioni, licenze, commercialista', range: '2\\u20133%' },\n      { key: 'altri', label: 'Altri costi generali / imprevisti', range: '~2%' }\n    ];\n    const csv = src.costStruct || this.state.costStruct;\n    const avgPrice = base.reduce((s, x) => s + x.price, 0) / base.length;\n    const altriPct = CS_DEF.reduce((s, v) => s + (parseFloat(csv[v.key]) || 0), 0);\n    const netK = 1 - altriPct / 100;\n    const weekMarginNet = base.reduce((s, x) => s + (unitsOf(x.name) > 0 ? unitsOf(x.name) * (x.price * netK - x.fc) : 0), 0);\n    const avgNetMargin = base.reduce((s, x) => s + (x.price * netK - x.fc), 0) / base.length;\n    const guadPct = 100 - wFc - altriPct;\n    const maxVoice = Math.max(...CS_DEF.map((v) => parseFloat(csv[v.key]) || 0), 1);\n    const pf = (n) => (Math.round(n * 10) / 10).toString().replace('.', ',') + '%';\n    const kpis = [\n      { k: 'Voci a men\\u00f9', v: String(focList.length + specialList.length) + ' + ' + tranList.length + ' + ' + dolceList.length, s: (focList.length + specialList.length) + ' focacce' + (specialList.length ? ' (' + specialList.length + ' special)' : '') + ' \\u00b7 ' + tranList.length + ' tranci \\u00b7 ' + dolceList.length + ' dolci' + (archivedList.length ? ' \\u00b7 ' + archivedList.length + ' arch.' : '') },\n      { k: 'Food cost medio', v: fmt(wFc) + '%', s: 'target di settore: 25\\u201330%' },\n      hasSales\n        ? { k: 'Margine netto / sett.', v: eur(weekMarginNet), s: 'al netto degli altri costi' }\n        : { k: 'Margine netto medio', v: eur(avgNetMargin), s: 'per focaccia, al netto degli altri costi' },\n      hasSales\n        ? { k: 'Incasso / settimana', v: eur(weekRevenue), s: 'stima sui dati inseriti' }\n        : { k: 'Dati di vendita', v: '0 / ' + base.length, s: 'inserisci i venduti a settimana' }\n    ];\n\n    const d = base.find((x) => x.name === this.state.selA) || base[0];\n    const sim = priceOf(d.name);\n    const sDelta = sim - d.sugg;\n    const verdict =\n      sDelta > 2\n        ? 'Ben sopra il prezzo consigliato: ampio margine di sicurezza, spazio per promozioni mirate.'\n        : sDelt
